name: Supply-chain Report

on:
  schedule:
    # Weekly on Sunday.
    - cron: "47 5 * * 0"
  workflow_dispatch:
    inputs:
      publish:
        description: "Record the results in the data branch and deploy the site (a second run for the same week replaces it and is listed on the corrections page)"
        type: boolean
        default: true
      reason:
        description: "Why this run is needed; recorded with the run's provenance"
        type: string
        required: false
      replay_date:
        description: "Instead of scanning, re-derive a recorded week (YYYY-MM-DD) from its evidence release and publish it as a correction"
        type: string
        required: false
  pull_request:
    paths:
      - ".github/workflows/supply-chain-report.yml"
      - "scripts/supply_chain_scan.py"
      - "scripts/supply_chain_checks.py"
      - "scripts/enrichment.py"
      - "scripts/catalog.py"
      - "scripts/build_site.py"
      - "scripts/site_sections.py"
      - "scripts/site_exports.py"
      - "scripts/fetch-site-inputs.sh"
      - "scripts/report-run.sh"
      - "scripts/install-supply-chain-tools.sh"
      - "benchmarks/supply-chain/*.json"
      - "tests/test_supply_chain_scan.py"
      - "tests/test_catalog.py"
  push:
    # Code changes on main only rebuild and redeploy the site from the recorded data; they never
    # scan or publish, so a mid-week merge cannot replace the week or move the drift baseline.
    branches: [main]
    paths:
      - ".github/workflows/supply-chain-report.yml"
      - "scripts/build_site.py"
      - "scripts/site_sections.py"
      - "scripts/site_exports.py"
      - "scripts/fetch-site-inputs.sh"
      - "scripts/report-run.sh"
      - "benchmarks/supply-chain/*.json"

permissions: {}

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: false

env:
  DATA_BRANCH: supply-chain-data
  SHARDS: "8"

jobs:
  targets:
    name: Resolve catalog releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      mode: ${{ steps.targets.outputs.mode }}
      date: ${{ steps.targets.outputs.date }}
      replay_release: ${{ steps.targets.outputs.replay_release }}
      baseline_run: ${{ steps.baseline.outputs.run_id }}
      baseline_attempt: ${{ steps.baseline.outputs.attempt }}
      baseline_release: ${{ steps.baseline.outputs.evidence_release }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Test scanner and site generation
        shell: bash
        run: python3 -m unittest tests/test_supply_chain_scan.py tests/test_catalog.py

      - name: Resolve the latest release of every active catalog project
        id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          REPLAY_DATE: ${{ inputs.replay_date }}
        shell: bash
        run: |
          set -euo pipefail
          limit=()
          # publish: full scan recorded in the data branch. preview: scan, build a site artifact only.
          # site: no scan; rebuild and redeploy the site from the recorded data.
          mode=preview
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Pull requests scan a small, varied sample to validate the pipeline.
            limit=(--only gitleaks/gitleaks --only PyCQA/bandit --only aquasecurity/trivy --only semgrep/semgrep)
          elif [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            mode=preview
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            mode=publish
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PUBLISH_INPUT" == "true" ]]; then
            mode=publish
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            mode=site
          fi
          replay_release=""
          if [[ -n "$REPLAY_DATE" && "$mode" == "publish" && "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # A correction: the week's own evidence is re-derived; nothing is scanned or fetched live except the
            # OSV API lookup, which is recorded with its own time.
            [[ "$REPLAY_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "replay_date must be YYYY-MM-DD" >&2; exit 1; }
            git fetch --quiet --depth 1 origin "$DATA_BRANCH"
            replay_release=$(git show "FETCH_HEAD:runs/$REPLAY_DATE.json" | jq -r '.evidence_release // empty')
            [[ -n "$replay_release" ]] || { echo "no evidence release recorded for $REPLAY_DATE" >&2; exit 1; }
            gh release download "$replay_release" --repo "$GITHUB_REPOSITORY" --pattern "supply-chain-evidence-*.tar.gz" --dir replay-release
            mkdir -p replay-evidence
            tar -xzf replay-release/supply-chain-evidence-*.tar.gz -C replay-evidence
            cp replay-evidence/targets.json targets.json
            matrix=$(jq -c '[.shards | to_entries[] | select(.value | length > 0) | .key]' targets.json)
          elif [[ "$mode" == "site" ]]; then
            matrix='[]'
            echo '{"targets": [], "shards": []}' > targets.json
          else
            matrix=$(python3 scripts/supply_chain_scan.py targets --tools tools \
              --shards "$SHARDS" --output targets.json "${limit[@]}")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "replay_release=$replay_release" >> "$GITHUB_OUTPUT"
          # A week is named by its Sunday (UTC), the scheduled day; a second run in the same week supersedes the
          # first instead of starting a new week. A week already recorded under another day keeps that date.
          today=$(date -u +%F)
          week=$(date -u -d "$today -$(date -u -d "$today" +%w) days" +%F)
          latest=""
          if git fetch --quiet --depth 1 origin "$DATA_BRANCH" 2>/dev/null; then
            latest=$(git show FETCH_HEAD:index.json 2>/dev/null | jq -r '.latest // empty' || true)
          fi
          if [[ -n "$latest" && "$latest" > "$week" ]]; then
            week=$latest
          fi
          if [[ -n "$replay_release" ]]; then
            week=$REPLAY_DATE
          fi
          echo "date=$week" >> "$GITHUB_OUTPUT"
          echo "### Supply-chain targets ($mode)" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.targets[] | "- \(.repository) @ \(.ref // "unresolved") (\(.ref_kind))"' targets.json >> "$GITHUB_STEP_SUMMARY"

      - name: Find the run that produced last week's data
        id: baseline
        if: steps.targets.outputs.mode != 'site'
        env:
          GH_TOKEN: ${{ github.token }}
          DATE: ${{ steps.targets.outputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --quiet --depth=1 origin "$DATA_BRANCH"
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/data"
          fi
          run_id=$(bash scripts/report-run.sh "$RUNNER_TEMP/data" "$DATE")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [[ -f "$RUNNER_TEMP/data/index.json" ]]; then
            baseline=$(python3 scripts/supply_chain_scan.py baseline --data-dir "$RUNNER_TEMP/data" --date "$DATE")
            echo "attempt=$(jq -r '.attempt // empty' <<<"$baseline")" >> "$GITHUB_OUTPUT"
            echo "evidence_release=$(jq -r '.evidence_release // empty' <<<"$baseline")" >> "$GITHUB_OUTPUT"
          fi
          echo "Drift baseline: ${run_id:-none (first week)}" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain target list
        if: steps.targets.outputs.mode != 'site'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-targets
          path: targets.json
          retention-days: 90

      # Downloaded here, in a read-only job, so the job that writes the data branch only reads files.
      # A failed download is recorded in enrichment.json and the week is published without it.
      - name: Download the CISA KEV catalog and EPSS scores
        if: steps.targets.outputs.mode != 'site'
        env:
          REPLAY_RELEASE: ${{ steps.targets.outputs.replay_release }}
        shell: bash
        run: |
          if [[ -n "$REPLAY_RELEASE" ]]; then
            # A replay uses the snapshots the week was recorded with.
            cp -R replay-evidence/supply-chain-enrichment enrichment
          else
            python3 scripts/supply_chain_scan.py enrich --output-dir enrichment
          fi

      - name: Retain exploitation data
        if: steps.targets.outputs.mode != 'site'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-enrichment
          path: enrichment
          if-no-files-found: error
          retention-days: 90

      - name: Retain the evidence being replayed
        if: steps.targets.outputs.replay_release != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-replay-evidence
          path: replay-evidence
          if-no-files-found: error
          retention-days: 7

  scan:
    name: Scan shard ${{ matrix.shard }}
    needs: targets
    if: needs.targets.outputs.mode != 'site'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download target list
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: supply-chain-targets

      - name: Install checksum-verified scanners
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash scripts/install-supply-chain-tools.sh "$RUNNER_TEMP/tools" "$RUNNER_TEMP/tool-metadata.json"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Update the vulnerability database
        if: needs.targets.outputs.replay_release == ''
        shell: bash
        run: grype db update

      - name: Download the evidence being replayed
        if: needs.targets.outputs.replay_release != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: supply-chain-replay-evidence
          path: replay-evidence

      - name: Download last week's SBOMs for drift comparison
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RUN: ${{ needs.targets.outputs.baseline_run }}
          BASELINE_RELEASE: ${{ needs.targets.outputs.baseline_release }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$BASELINE_RUN
          mkdir -p "$RUNNER_TEMP/previous"
          found=""
          if [[ -n "$run_id" ]] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --pattern "supply-chain-shard-*" --dir "$RUNNER_TEMP/previous-download" 2>/dev/null; then
            found="run $run_id artifacts"
          elif [[ -n "$BASELINE_RELEASE" ]] && gh release download "$BASELINE_RELEASE" --repo "$GITHUB_REPOSITORY" \
              --pattern "supply-chain-evidence-*.tar.gz" --dir "$RUNNER_TEMP/previous-release" 2>/dev/null; then
            # Artifacts expire after 90 days; the evidence release holds the same files.
            mkdir -p "$RUNNER_TEMP/previous-download"
            tar -xzf "$RUNNER_TEMP"/previous-release/supply-chain-evidence-*.tar.gz -C "$RUNNER_TEMP/previous-download"
            found="evidence release $BASELINE_RELEASE"
          fi
          if [[ -n "$found" ]]; then
            # Flatten shard directories into one directory per project.
            find "$RUNNER_TEMP/previous-download" -mindepth 2 -maxdepth 2 -type d -name '*__*' \
              -exec cp -R {} "$RUNNER_TEMP/previous/" \;
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "Comparing with $found"
          elif [[ -n "$run_id" ]]; then
            # Publishing marks the dependency comparison unavailable instead of treating the week as a baseline.
            echo "::warning::last week's SBOMs (run $run_id) could not be downloaded; dependency changes will be unavailable"
          else
            echo "No previous run; this week is a baseline."
          fi

      - name: Scan projects
        env:
          # The Scorecard CLI needs ~100 GitHub API calls per repository. The workflow token allows
          # one fallback per shard each week; an optional SCORECARD_TOKEN secret lifts that limit.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SCORECARD_TOKEN: ${{ secrets.SCORECARD_TOKEN }}
          REPLAY_RELEASE: ${{ needs.targets.outputs.replay_release }}
          SHARD: ${{ matrix.shard }}
          PREVIOUS_RUN_ID: ${{ steps.previous.outputs.run_id }}
          PREVIOUS_RUN_ATTEMPT: ${{ needs.targets.outputs.baseline_attempt }}
        shell: bash
        run: |
          if [[ -n "$REPLAY_RELEASE" ]]; then
            python3 scripts/supply_chain_scan.py replay \
              --evidence-dir replay-evidence --shard "$SHARD" --output-dir scan-output \
              --previous-dir "$RUNNER_TEMP/previous" \
              --previous-run-id "$PREVIOUS_RUN_ID" --previous-run-attempt "$PREVIOUS_RUN_ATTEMPT" \
              --osv-api --source "$REPLAY_RELEASE"
            exit 0
          fi
          limit=1
          if [[ -n "$SCORECARD_TOKEN" ]]; then
            limit=20
          fi
          python3 scripts/supply_chain_scan.py scan \
            --targets targets.json \
            --shard "$SHARD" \
            --output-dir scan-output \
            --previous-dir "$RUNNER_TEMP/previous" \
            --previous-run-id "$PREVIOUS_RUN_ID" --previous-run-attempt "$PREVIOUS_RUN_ATTEMPT" \
            --scorecard-cli-limit "$limit"

      - name: Check every summary against its raw evidence
        env:
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          python3 scripts/supply_chain_scan.py audit --shards-dir scan-output \
            --previous-dir "$RUNNER_TEMP/previous" --sbomlyze sbomlyze | tee audit.txt
          status=${PIPESTATUS[0]}
          { echo "### Accuracy audit, shard $SHARD"; echo '```'; tail -n 50 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Retain SBOMs, vulnerability reports, and summaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-shard-${{ matrix.shard }}
          path: scan-output
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Record, attest, and release the week
    needs: [targets, scan]
    # Every shard must succeed; a partial week is never recorded (the previous week stays current).
    if: needs.targets.outputs.mode == 'publish' && needs.scan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      DATE: ${{ needs.targets.outputs.date }}
    steps:
      # This job never executes downloaded tool binaries; it only runs repository Python on
      # the normalized JSON produced by the read-only scan jobs.
      # The commit that triggered the run, not the moving default branch: the code that normalizes and
      # publishes the scan must be the code the run records as its provenance.
      - name: Check out the triggering commit with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Confirm the checked-out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download shard results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: supply-chain-shard-*
          path: shards

      - name: Download target list
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: supply-chain-targets
          path: shards

      - name: Download exploitation data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: supply-chain-enrichment
          path: shards/supply-chain-enrichment

      - name: Prepare the data branch worktree
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch origin "+refs/heads/$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"
            git worktree add -B "$DATA_BRANCH" data "origin/$DATA_BRANCH"
          else
            git worktree add --detach data
            git -C data checkout --orphan "$DATA_BRANCH"
            git -C data rm -rf --quiet .
          fi

      - name: Choose the evidence release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="report-$DATE"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null || gh release view "$tag" >/dev/null 2>&1; then
            # Releases are immutable; a re-run of the week gets its own tag.
            tag="report-$DATE-run$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download last week's exploitation snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_RELEASE: ${{ needs.targets.outputs.baseline_release }}
        shell: bash
        run: |
          # For weeks whose run record predates the stored KEV CVE list; only JSON and CSV files are read.
          mkdir -p previous-enrichment
          if [[ -n "$BASELINE_RELEASE" ]] && gh release download "$BASELINE_RELEASE" --repo "$GITHUB_REPOSITORY" \
              --pattern "supply-chain-evidence-*.tar.gz" --dir previous-release 2>/dev/null; then
            tar -xzf previous-release/supply-chain-evidence-*.tar.gz -C previous-enrichment --strip-components=2 \
              ./supply-chain-enrichment || true
          fi

      - name: Record results and changes
        env:
          REASON: ${{ inputs.reason }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPLAY_RELEASE: ${{ needs.targets.outputs.replay_release }}
        shell: bash
        run: |
          derivation=()
          if [[ -n "$REPLAY_RELEASE" ]]; then
            derivation=(--derivation "re-derived from the evidence of $REPLAY_RELEASE with the current method (scan results, release checks, and KEV/EPSS snapshots are the original ones; the OSV API lookup was made during this run)")
          fi
          python3 scripts/supply_chain_scan.py publish \
            --shards-dir shards --data-dir data --date "$DATE" \
            --reason "$REASON" --evidence-release "$TAG" \
            --enrichment-dir shards/supply-chain-enrichment --targets shards/targets.json \
            --previous-enrichment-dir previous-enrichment "${derivation[@]}"

      - name: Check the recorded week against the shard results
        shell: bash
        run: python3 scripts/supply_chain_scan.py audit --shards-dir shards --data-dir data --date "$DATE"

      - name: Commit the data branch
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit --quiet -m "record supply-chain scan $DATE (run $GITHUB_RUN_ID, attempt $GITHUB_RUN_ATTEMPT)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify the new commit before publishing it
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: python3 scripts/supply_chain_scan.py verify --data-dir data --history

      - name: Bundle the raw evidence
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --owner=0 --group=0 --numeric-owner -czf "supply-chain-evidence-$DATE.tar.gz" -C shards .
          cp data/SHA256SUMS data-SHA256SUMS

      - name: Attest every data file
        if: steps.commit.outputs.changed == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: data/SHA256SUMS

      - name: Attest the checksum list and the evidence bundle
        if: steps.commit.outputs.changed == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            data/SHA256SUMS
            supply-chain-evidence-${{ needs.targets.outputs.date }}.tar.gz

      - name: Check the new attestation
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 scripts/supply_chain_scan.py verify --data-dir data --attestations

      - name: Push the data branch
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: git -C data push origin "HEAD:$DATA_BRANCH"

      - name: Publish the evidence release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          projects=$(jq '.projects | length' "data/runs/$DATE.json")
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          {
            echo "Raw evidence for the [weekly supply-chain report]($site/history/$DATE/index.html) of $DATE: $projects catalog projects."
            echo
            echo "- Produced by [run $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) at commit $GITHUB_SHA."
            echo "- \`supply-chain-evidence-$DATE.tar.gz\`: per project, the CycloneDX SBOM, Grype, OSV-Scanner, and govulncheck output, sbomlyze diff, and \`summary.json\` with release-integrity details; plus the target list and the CISA KEV and FIRST EPSS snapshots used (\`supply-chain-enrichment/\`)."
            echo "- \`data-SHA256SUMS\`: digests of every file in the data branch at commit $SHA, which this tag points to."
            echo
            echo "Verify: \`gh attestation verify supply-chain-evidence-$DATE.tar.gz --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/supply-chain-report.yml\`. See $site/verify/index.html for what this proves."
          } > release-notes.md
          gh release create "$TAG" "supply-chain-evidence-$DATE.tar.gz" data-SHA256SUMS \
            --target "$SHA" --title "Supply-chain report evidence $DATE" --notes-file release-notes.md --latest=false

  site:
    name: Build the report site
    needs: [targets, scan, publish]
    # A publish run deploys only after its week was recorded; otherwise this run's shard artifacts would be
    # shown next to the previous week's data.
    if: >-
      always()
      && needs.scan.result != 'cancelled'
      && (needs.targets.outputs.mode == 'publish'
          && needs.publish.result == 'success'
          || needs.targets.outputs.mode != 'publish'
          && (needs.publish.result == 'success' || needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download this week's shard results
        if: needs.targets.outputs.mode != 'site'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: supply-chain-shard-*
          path: site-input/supply-chain-artifacts

      - name: Download the target list for previews
        if: needs.targets.outputs.mode == 'preview'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: supply-chain-targets
          path: site-input

      - name: Download exploitation data for previews
        if: needs.targets.outputs.mode == 'preview'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: supply-chain-enrichment
          path: site-input/enrichment

      - name: Fetch the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/fetch-site-inputs.sh site-input

      - name: Include this run in previews
        if: needs.targets.outputs.mode == 'preview'
        env:
          DATE: ${{ needs.targets.outputs.date }}
        shell: bash
        run: |
          python3 scripts/supply_chain_scan.py publish \
            --shards-dir site-input/supply-chain-artifacts \
            --data-dir site-input/supply-chain-data \
            --date "$DATE" --reason "preview, not published" \
            --enrichment-dir site-input/enrichment --targets site-input/targets.json

      - name: Build static site
        shell: bash
        run: |
          python3 scripts/build_site.py \
            --output site \
            --repository "$GITHUB_REPOSITORY" \
            --supply-chain-data site-input/supply-chain-data \
            --supply-chain-artifacts site-input/supply-chain-artifacts

      - name: Upload Pages artifact
        if: needs.targets.outputs.mode != 'preview'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          # One name per attempt so "Re-run failed jobs" can deploy without a duplicate-artifact error.
          name: github-pages-${{ github.run_attempt }}

      - name: Upload site preview
        if: needs.targets.outputs.mode == 'preview'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-site-preview
          path: site
          retention-days: 14

  deploy:
    name: Deploy the report site
    needs: [targets, site]
    if: always() && needs.site.result == 'success' && needs.targets.outputs.mode != 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
