name: SBOM Compatibility Benchmark

on:
  schedule:
    # Weekly run; every run on the default branch is recorded and published.
    - cron: "23 4 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sbom-benchmark.yml"
      - "benchmarks/sbom/**"
      - "comparisons/sbom-tools.md"
      - "examples/security-demo/fixtures/dependencies/**"
      - "scripts/install-sbom-benchmark-tools.sh"
      - "scripts/sbom_benchmark.py"
      - "scripts/sbomlyze_compare.py"
      - "scripts/derive_image_ground_truth.py"
      - "scripts/publish_sbom_benchmark.py"
      - "scripts/build_sbom_site.py"
      - "scripts/build_site.py"
      - "scripts/fetch-site-inputs.sh"
      - "tests/test_sbom_benchmark.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sbom-benchmark.yml"
      - "benchmarks/sbom/**"
      - "examples/security-demo/fixtures/dependencies/**"
      - "scripts/install-sbom-benchmark-tools.sh"
      - "scripts/sbom_benchmark.py"
      - "scripts/sbomlyze_compare.py"
      - "scripts/derive_image_ground_truth.py"
      - "scripts/publish_sbom_benchmark.py"
      - "scripts/build_sbom_site.py"
      - "scripts/build_site.py"
      - "scripts/fetch-site-inputs.sh"
      - "tests/test_sbom_benchmark.py"

permissions: {}

concurrency:
  group: sbom-benchmark-${{ github.ref }}
  cancel-in-progress: false

env:
  DATA_BRANCH: sbom-benchmark-data

jobs:
  benchmark:
    name: Run generators, score, and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.result.outputs.publish }}
      run_date: ${{ steps.result.outputs.run_date }}
      status: ${{ steps.result.outputs.status }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Test benchmark normalization, scoring, and site generation
        shell: bash
        run: python3 -m unittest tests/test_sbom_benchmark.py

      - name: Install latest stable benchmark tools
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash scripts/install-sbom-benchmark-tools.sh \
            "$RUNNER_TEMP/sbom-tools" \
            "$RUNNER_TEMP/tool-metadata.json"
          echo "$RUNNER_TEMP/sbom-tools" >> "$GITHUB_PATH"

      - name: Pull the immutable container fixture
        shell: bash
        run: |
          set -euo pipefail
          source_image=$(jq -r '.fixtures[] | select(.kind == "image") | .source_image' benchmarks/sbom/fixtures.json)
          docker pull --platform linux/amd64 "$source_image"
          docker tag "$source_image" sbom-benchmark:container

      - name: Confirm container ground truth against the image's package database
        shell: bash
        run: python3 scripts/derive_image_ground_truth.py --config benchmarks/sbom/fixtures.json --check

      - name: Load the previous normalized run from the data branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git show FETCH_HEAD:latest.json > "$RUNNER_TEMP/previous.json"
            echo "Previous run: $(jq -r '.run_date' "$RUNNER_TEMP/previous.json")"
          else
            echo "No data branch yet; this run is a baseline."
          fi

      - name: Download the previous run's raw SBOMs for drift analysis
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidates=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sbom-benchmark.yml \
            --branch main --status completed --limit 20 --json databaseId,event \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and (.event == \"schedule\" or .event == \"push\" or .event == \"workflow_dispatch\")) | .databaseId] | .[:5][]")
          for run_id in $candidates; do
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --name "sbom-benchmark-$run_id" --dir "$RUNNER_TEMP/previous-artifact" 2>/dev/null \
              && [[ -d "$RUNNER_TEMP/previous-artifact/raw" ]]; then
              echo "Using raw SBOMs from run $run_id ($(jq -r '.run_date' "$RUNNER_TEMP/previous-artifact/result.json"))"
              exit 0
            fi
            rm -rf "$RUNNER_TEMP/previous-artifact"
          done
          echo "No previous raw SBOMs available; drift analysis is skipped for this run."

      - name: Run full compatibility benchmark
        id: run
        continue-on-error: true
        env:
          SBOM_BENCHMARK_CACHE_DIR: ${{ runner.temp }}/sbom-benchmark-cache
        shell: bash
        run: |
          previous=()
          if [[ -f "$RUNNER_TEMP/previous.json" ]]; then
            previous=(--previous "$RUNNER_TEMP/previous.json")
          fi
          python3 scripts/sbom_benchmark.py \
            --config benchmarks/sbom/fixtures.json \
            --tool-metadata "$RUNNER_TEMP/tool-metadata.json" \
            --output-dir benchmark-output \
            --commit "$GITHUB_SHA" \
            "${previous[@]}"

      - name: Analyze documents with sbomlyze
        if: always() && hashFiles('benchmark-output/result.json') != ''
        continue-on-error: true
        shell: bash
        run: |
          previous=()
          if [[ -d "$RUNNER_TEMP/previous-artifact/raw" ]]; then
            previous=(
              --previous-raw-dir "$RUNNER_TEMP/previous-artifact/raw"
              --previous-run-date "$(jq -r '.run_date' "$RUNNER_TEMP/previous-artifact/result.json")"
            )
          fi
          python3 scripts/sbomlyze_compare.py \
            --result benchmark-output/result.json \
            --raw-dir benchmark-output/raw \
            --output-dir benchmark-output/sbomlyze \
            --redact "$GITHUB_WORKSPACE/benchmark-output=\$OUTPUT_DIR" \
            --redact "$GITHUB_WORKSPACE=\$REPOSITORY" \
            --redact "$RUNNER_TEMP=\$RUNNER_TEMP" \
            --redact "$HOME=\$HOME" \
            "${previous[@]}"

      - name: Determine result and publication
        id: result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f benchmark-output/result.json
          status=$(jq -r '.status' benchmark-output/result.json)
          run_date=$(jq -r '.run_date' benchmark-output/result.json)
          publish=false
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            publish=true
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "run_date=$run_date" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          cat benchmark-output/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Publish to the data branch and site: $publish" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain normalized result, raw SBOMs, analysis, and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-benchmark-${{ github.run_id }}
          path: benchmark-output
          if-no-files-found: error
          retention-days: 90

  regression-gate:
    name: Enforce benchmark expectations
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Download normalized result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-benchmark-${{ github.run_id }}
          path: benchmark-output

      - name: Fail on generator, validation, expectation, or ground-truth regression
        shell: bash
        run: |
          jq -r '
            .fixtures[] as $fixture
            | $fixture.runs[]
            | select(.status != "passed")
            | "\($fixture.id) / \(.tool): \(.errors | join("; "))"
          ' benchmark-output/result.json
          test "$(jq -r '.status' benchmark-output/result.json)" = "passed"

  publish-data:
    name: Record the run in the data branch
    needs: benchmark
    if: needs.benchmark.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # This job never executes downloaded tool binaries; it only runs repository Python on
      # the normalized JSON produced by the read-only benchmark job.
      - name: Check out default branch with history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download benchmark evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-benchmark-${{ github.run_id }}
          path: benchmark-output

      - name: Prepare the data branch worktree
        id: data
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch origin "+refs/heads/$DATA_BRANCH:refs/remotes/origin/$DATA_BRANCH"
            git worktree add -B "$DATA_BRANCH" data "origin/$DATA_BRANCH"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            git worktree add --detach data
            git -C data checkout --orphan "$DATA_BRANCH"
            git -C data rm -rf --quiet .
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect legacy monthly snapshots for a new data branch
        if: steps.data.outputs.new == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p legacy
          source=HEAD
          removed=$(git log -1 --format=%H --diff-filter=D -- reports/sbom/history)
          if [[ -n "$removed" ]]; then
            source="$removed^"
          fi
          git ls-tree --name-only "$source" reports/sbom/history/ | { grep '\.json$' || true; } | while read -r path; do
            git show "$source:$path" > "legacy/$(basename "$path")"
          done
          echo "Legacy snapshots: $(ls legacy | tr '\n' ' ')"

      - name: Record normalized run
        shell: bash
        run: |
          set -euo pipefail
          seeds=()
          for path in legacy/*.json; do
            [[ -f "$path" ]] && seeds+=(--seed "$path")
          done
          python3 scripts/publish_sbom_benchmark.py \
            --data-dir data \
            --config benchmarks/sbom/fixtures.json \
            --result benchmark-output/result.json \
            --sbomlyze benchmark-output/sbomlyze/sbomlyze.json \
            "${seeds[@]}"

      - name: Commit and push the data branch
        shell: bash
        run: |
          set -euo pipefail
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit --quiet -m "record SBOM benchmark run ${{ needs.benchmark.outputs.run_date }}"
          git push origin "HEAD:$DATA_BRANCH"

  site:
    name: Build the report site
    needs: [benchmark, publish-data]
    if: >-
      always()
      && needs.benchmark.result == 'success'
      && (needs.publish-data.result == 'success' || needs.publish-data.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download benchmark evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-benchmark-${{ github.run_id }}
          path: benchmark-output

      - name: Fetch data branches and the latest supply-chain artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p site-input
          cp -R benchmark-output/sbomlyze site-input/benchmark-artifacts
          bash scripts/fetch-site-inputs.sh site-input

      - name: Include this run
        shell: bash
        run: |
          # Idempotent on the default branch; adds this run for pull-request previews.
          python3 scripts/publish_sbom_benchmark.py \
            --data-dir site-input/benchmark-data \
            --config benchmarks/sbom/fixtures.json \
            --result benchmark-output/result.json \
            --sbomlyze benchmark-output/sbomlyze/sbomlyze.json

      - name: Build static site
        shell: bash
        run: |
          python3 scripts/build_site.py \
            --output site \
            --repository "$GITHUB_REPOSITORY" \
            --supply-chain-data site-input/supply-chain-data \
            --supply-chain-artifacts site-input/supply-chain-artifacts \
            --benchmark-data site-input/benchmark-data \
            --benchmark-artifacts site-input/benchmark-artifacts

      - name: Upload Pages artifact
        if: needs.benchmark.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Upload site preview
        if: needs.benchmark.outputs.publish != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-benchmark-site-preview
          path: site
          retention-days: 14

  deploy:
    name: Deploy the report site
    needs: [benchmark, site]
    if: always() && needs.site.result == 'success' && needs.benchmark.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}sbom-benchmark/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
